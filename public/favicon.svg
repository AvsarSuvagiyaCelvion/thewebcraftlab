  <path d="M56 30L44 70" stroke="url(#grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="4" fill="#06B6D4" filter="url(#glow)" />
</svg>
